<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
<h1>Books</h1>

<p>
    Logged in as <b th:text="${username}"></b>
<form th:action="@{/logout}" method="post" style="display:inline">
    <button type="submit">Log out</button>
</form>
</p>

<table border="1" cellpadding="5">
    <tr>
        <th>ID</th><th>Title</th><th>Author</th><th>Genre</th>
        <th>Year</th><th>Available</th><th th:if="${isAdmin}">Actions</th>
    </tr>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.genre}"></td>
        <td th:text="${book.publicationYear}"></td>
        <td th:text="${book.available}"></td>
        <td th:if="${isAdmin}">
            <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

<div th:if="${isAdmin}">
    <h2>Add book</h2>
    <form th:action="@{/books}" th:object="${bookForm}" method="post">
        <div><label>Title: <input type="text" th:field="*{title}"></label>
            <span th:errors="*{title}" style="color:red"></span></div>
        <div><label>Author: <input type="text" th:field="*{author}"></label>
            <span th:errors="*{author}" style="color:red"></span></div>
        <div><label>Genre: <input type="text" th:field="*{genre}"></label>
            <span th:errors="*{genre}" style="color:red"></span></div>
        <div><label>Year: <input type="number" th:field="*{publicationYear}"></label>
            <span th:errors="*{publicationYear}" style="color:red"></span></div>
        <button type="submit">Add</button>
    </form>
</div>
</body>
</html>
